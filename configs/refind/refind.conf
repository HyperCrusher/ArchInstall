timeout 10

use_nvram true

resolution max

use_graphics_for osx,linux

showtools shutdown,reboot

menuentry "Arch" {
  icon    /EFI/BOOT/themes/tokyo-night/icons/os_arch.png
  loader  vmlinuz-linux
  initrd  initramfs-linux.img
  options "root=UUID=uuid rw add_efi_memmap quiet nvidia_drm.modeset=1"
  submenuentry "Boot using fallback initramfs" {
    initrd initramfs-linux-fallback.img
  }
}

scanfor external,manual
include themes/tokyo-night/theme.conf
